name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: npm run dist

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.deb
            release/latest.yml
            release/latest-linux.yml

      - name: Upload to Cloudflare R2 (Windows)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && !contains(github.ref, '-beta') && matrix.os == 'windows-latest'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "latest.yml"
          aws s3 cp release/ s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "latest.yml"

      - name: Upload to Cloudflare R2 (Linux)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && !contains(github.ref, '-beta') && matrix.os == 'ubuntu-latest'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.deb" \
            --include "latest-linux.yml"
          aws s3 cp release/ s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.deb" \
            --include "latest-linux.yml"

      - name: Upload Windows Artifacts (Optional)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        with:
          name: windows-artifacts
          retention-days: 1
          path: |
            release/*.exe
            release/latest.yml

      - name: Upload Linux Artifacts (Optional)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        with:
          name: linux-artifacts
          retention-days: 1
          path: |
            release/*.deb
            release/latest-linux.yml
