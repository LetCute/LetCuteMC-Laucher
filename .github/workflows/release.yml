name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: npm run dist

      - name: Release to GitHub (Windows)
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && matrix.os == 'windows-latest'
        with:
          files: |
            release/*.exe

      - name: Release to GitHub (Linux)
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && matrix.os == 'ubuntu-latest'
        with:
          files: |
            release/*.AppImage
            release/*.deb

      - name: Release to GitHub (Mac)
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && matrix.os == 'macos-latest'
        with:
          files: |
            release/*.dmg
