name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Kênh phát hành (stable: chính thức | beta: thử nghiệm)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
        run: npm run dist

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') || github.event.inputs.channel == 'beta' }}
          files: |
            release/*.exe
            release/*.deb
            release/latest.yml
            release/latest-linux.yml

      # -------------------------------------------------------------------------
      # BẢN CHÍNH THỨC (STABLE) -> Đẩy vào thư mục gốc để người dùng tự động update
      # -------------------------------------------------------------------------
      - name: Upload to Cloudflare R2 - Stable (Windows)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') && github.event.inputs.channel != 'beta' && matrix.os == 'windows-latest'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "latest.yml"
          rm -rf release/win-unpacked release/*-unpacked
          aws s3 cp release/ s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "latest.yml" \
            --exclude "*win-unpacked*"

      - name: Upload to Cloudflare R2 - Stable (Linux)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') && github.event.inputs.channel != 'beta' && matrix.os == 'ubuntu-latest'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.deb" \
            --include "latest-linux.yml"
          rm -rf release/linux-unpacked release/*-unpacked
          aws s3 cp release/ s3://storage-letcute/letcutemc-launcher/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.deb" \
            --include "latest-linux.yml"

      # -------------------------------------------------------------------------
      # BẢN BETA (THỬ NGHIỆM) -> Đẩy vào thư mục /beta/ riêng biệt, tránh auto-update nhầm
      # -------------------------------------------------------------------------
      - name: Upload to Cloudflare R2 - Beta (Windows)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && (contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') || github.event.inputs.channel == 'beta') && matrix.os == 'windows-latest'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://storage-letcute/letcutemc-launcher/beta/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "latest.yml"
          rm -rf release/win-unpacked release/*-unpacked
          aws s3 cp release/ s3://storage-letcute/letcutemc-launcher/beta/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "latest.yml" \
            --exclude "*win-unpacked*"

      - name: Upload to Cloudflare R2 - Beta (Linux)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && (contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') || github.event.inputs.channel == 'beta') && matrix.os == 'ubuntu-latest'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://storage-letcute/letcutemc-launcher/beta/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.deb" \
            --include "latest-linux.yml"
          rm -rf release/linux-unpacked release/*-unpacked
          aws s3 cp release/ s3://storage-letcute/letcutemc-launcher/beta/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "*.deb" \
            --include "latest-linux.yml"

      - name: Upload Windows Artifacts (Optional)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        with:
          name: windows-artifacts
          retention-days: 1
          path: |
            release/*.exe
            release/latest.yml

      - name: Upload Linux Artifacts (Optional)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        with:
          name: linux-artifacts
          retention-days: 1
          path: |
            release/*.deb
            release/latest-linux.yml
