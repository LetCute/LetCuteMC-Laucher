<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LetCuteMC Launcher</title>
  <style>
    /* Instant paint before React/CSS bundle — matches app background */
    html,
    body,
    #root {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #1c2127;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #boot-shell {
      display: flex;
      height: 100%;
    }

    #boot-shell .side {
      width: 240px;
      background: #15191e;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    #boot-shell .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #boot-shell .bar {
      height: 36px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    #boot-shell .body {
      flex: 1;
      padding: 24px;
    }

    #boot-shell .pulse {
      height: 112px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      animation: boot-pulse 1.2s ease-in-out infinite;
    }

    @keyframes boot-pulse {

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 0.85;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-shell" aria-hidden="true">
      <div class="side"></div>
      <div class="main">
        <div class="bar"></div>
        <div class="body">
          <div class="pulse"></div>
          <div class="pulse"></div>
          <div class="pulse"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/main.tsx"></script>
</body>

</html>
