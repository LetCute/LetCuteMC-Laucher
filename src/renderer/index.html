<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LetCuteMC Launcher</title>
  <style>
    /* Instant paint before React/CSS bundle — matches app background */
    html,
    body,
    #root {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #1c2127;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #boot-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: #1c2127;
      gap: 24px;
    }

    #boot-shell img {
      width: 120px;
      height: 120px;
      animation: boot-pulse 1.5s ease-in-out infinite;
    }

    #boot-shell .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: boot-spin 1s linear infinite;
    }

    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.95); opacity: 0.7; }
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-shell" aria-hidden="true">
      <img src="./logo.png" alt="LetCuteMC" />
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/main.tsx"></script>
</body>

</html>
